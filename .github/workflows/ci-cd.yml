name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run automated tests
        run: bash test.sh

      - name: Build Docker image
        run: docker build -t devops-cicd-app .

